name: Sync Markdown to Confluence

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/workflows/sync-to-confluence.yml'
      - '.github/scripts/sync_to_confluence.py'
  workflow_dispatch:
    inputs:
      full_sync:
        description: '전체 .md 파일을 다시 동기화 (true면 변경 여부와 무관하게 모두 푸시)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 변경된 파일 비교를 위해 이전 커밋까지 함께 가져옴
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown beautifulsoup4

      - name: Sync to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_ROOT_PAGE_ID: ${{ secrets.CONFLUENCE_ROOT_PAGE_ID }}
          FULL_SYNC: ${{ github.event.inputs.full_sync || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python .github/scripts/sync_to_confluence.py
